<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e12" />
      <stop offset="100%" stop-color="#141822" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Border Frame -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2"/>

  <!-- Metadata Top Header -->
  <text x="80" y="110" font-family="'JetBrains Mono', monospace" font-size="16" fill="#10b981" font-weight="700" letter-spacing="3">[001] • SYSTEMS ENGINEERING &amp; AOSP</text>
  <text x="1120" y="110" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="16" fill="#64748b" letter-spacing="1">PATNA, IN • 25.5941° N, 85.1376° E</text>
  <line x1="80" y1="135" x2="1120" y2="135" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

  <!-- Main Headline -->
  <text x="80" y="240" font-family="'Space Grotesk', 'Cabinet Grotesk', sans-serif" font-size="92" fill="url(#textGrad)" font-weight="900" letter-spacing="-3">SARTHAK</text>
  
  <text x="80" y="310" font-family="'Space Grotesk', sans-serif" font-size="34" fill="#94a3b8" font-weight="600">
    AOSP Custom Trees • Linux Kernel 5.10 • Systems Engineer
  </text>

  <!-- Key Badges -->
  <g transform="translate(80, 370)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="220" height="46" rx="12" fill="#1e293b" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="20" y="29" font-family="'JetBrains Mono', monospace" font-size="14" fill="#38bdf8" font-weight="600">MOTO EDGE 40 NEO</text>

    <!-- Badge 2 -->
    <rect x="235" y="0" width="200" height="46" rx="12" fill="#1e293b" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="255" y="29" font-family="'JetBrains Mono', monospace" font-size="14" fill="#4ade80" font-weight="600">KERNEL 5.10 LTS</text>

    <!-- Badge 3 -->
    <rect x="450" y="0" width="180" height="46" rx="12" fill="#1e293b" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="470" y="29" font-family="'JetBrains Mono', monospace" font-size="14" fill="#a78bfa" font-weight="600">MCA @ LPU 8.55</text>

    <!-- Badge 4 -->
    <rect x="645" y="0" width="180" height="46" rx="12" fill="#1e293b" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="665" y="29" font-family="'JetBrains Mono', monospace" font-size="14" fill="#facc15" font-weight="600">TRANSFORMERS.JS</text>
  </g>

