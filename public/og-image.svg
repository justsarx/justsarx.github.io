  <text x="80" y="525" font-family="'JetBrains Mono', monospace" font-size="16" fill="#e2e8f0" font-weight="600">justsarx.me</text>
  <text x="320" y="525" font-family="'JetBrains Mono', monospace" font-size="16" fill="#94a3b8">github.com/justsarx</text>
  <text x="620" y="525" font-family="'JetBrains Mono', monospace" font-size="16" fill="#94a3b8">sinhasarthak56@gmail.com</text>
  
  <rect x="1000" y="498" width="120" height="36" rx="10" fill="#10b981"/>
  <text x="1060" y="521" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#ffffff" font-weight="700">VERIFIED</text>
